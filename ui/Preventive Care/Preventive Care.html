<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PreventPath — Preventive Care</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root{
  --bg:#0C0C0E;
  --panel:#161618;
  --panel2:#1C1C1F;
  --panel3:#222226;
  --hair:rgba(255,255,255,.08);
  --hair2:rgba(255,255,255,.05);
  --ink:#F2F2F4;
  --ink2:rgba(235,235,245,.6);
  --ink3:rgba(235,235,245,.32);
  --accent:#4A80BC;
  --accent-ink:#7BA6D4;
  --accent-soft:rgba(74,128,188,.14);
  --attn:#CC8B5E;
  --attn-soft:rgba(204,139,94,.13);
  --good:#5FA585;
  --high:#CF8077;
  --radius:18px;
  --radius-sm:13px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  letter-spacing:-0.011em;
  font-weight:400;
}
#root{height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(10,132,255,.3)}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}

.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- App bar (top tier) ---------- */
.appbar{
  height:58px;flex-shrink:0;display:flex;align-items:center;
  padding:0 22px;gap:26px;
  background:var(--panel);
  border-bottom:1px solid var(--hair);
  position:relative;z-index:31;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(155deg,#4A80BC,#345E8C);color:#fff;display:grid;place-items:center;border:1px solid var(--hair)}
.brand-name{font-size:15.5px;font-weight:540;letter-spacing:-0.02em}
.appnav{display:flex;align-items:center;gap:4px;flex:1}
.appnav-item{font-size:13.5px;font-weight:460;color:var(--ink3);padding:8px 13px;border-radius:9px;transition:all .15s}
.appnav-item:hover{color:var(--ink2);background:var(--hair2)}
.appnav-item--on{color:var(--ink);background:var(--panel3)}
.appbar-right{display:flex;align-items:center;gap:13px;flex-shrink:0}
.appbar-divider{width:1px;height:24px;background:var(--hair)}
.mode-seg{display:flex;background:var(--panel2);border:1px solid var(--hair);border-radius:9px;padding:3px}
.mode-opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:480;color:var(--ink3);padding:5px 13px;border-radius:7px;transition:all .15s}
.mode-opt:hover{color:var(--ink2)}
.mode-opt--on{background:var(--panel3);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,165,133,.5)}70%{box-shadow:0 0 0 5px rgba(95,165,133,0)}100%{box-shadow:0 0 0 0 rgba(95,165,133,0)}}
.user-chip{display:flex;align-items:center;gap:8px}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--panel3);color:var(--ink);font-size:11px;font-weight:540;display:grid;place-items:center;border:1px solid var(--hair)}
.user-name{font-size:13.5px;font-weight:460;color:var(--ink2)}

/* ---------- Stage bar (second tier) ---------- */
.stagebar{
  height:54px;flex-shrink:0;display:flex;align-items:center;gap:18px;
  padding:0 22px;
  background:rgba(18,18,20,.55);
  border-bottom:1px solid var(--hair);
  position:relative;z-index:30;
}
.stagebar-label{font-size:12px;font-weight:480;letter-spacing:.02em;color:var(--ink3);flex-shrink:0}
.stagebar-progress{font-size:12px;font-weight:460;color:var(--ink3);margin-left:auto;flex-shrink:0}

.stepper{display:flex;align-items:center;gap:3px;flex-shrink:0}
.step{display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:9px;transition:background .15s}
.step:hover{background:var(--hair2)}
.step-num{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:540;background:var(--panel2);color:var(--ink3);border:1px solid var(--hair);transition:all .2s}
.step-label{font-size:13.5px;font-weight:450;color:var(--ink3);transition:color .2s;white-space:nowrap}
.step--done .step-num{background:rgba(95,165,133,.18);color:var(--good);border-color:transparent}
.step--done .step-label{color:var(--ink2)}
.step--on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--hair)}
.step--on .step-num{background:var(--accent);color:#fff;border-color:transparent}
.step--on .step-label{color:var(--ink);font-weight:520}
.step--locked{opacity:.4;cursor:not-allowed}
.step-line{width:20px;height:1px;background:var(--hair);transition:background .2s}
.step-line--done{background:rgba(95,165,133,.4)}

/* ---------- Stage / scroll ---------- */
.main-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.stage{max-width:1380px;margin:0 auto;padding:34px 40px 70px}
.stage>*{animation:rise .5s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}

.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:26px}
.stage-eyebrow{font-size:12px;font-weight:560;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.stage-title{font-size:30px;font-weight:560;letter-spacing:-0.03em;line-height:1.05}
.stage-lede{font-size:14.5px;font-weight:400;color:var(--ink2);line-height:1.55;max-width:620px;margin-top:11px}

.cta{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#fff;background:var(--accent);padding:12px 20px;border-radius:12px;white-space:nowrap;transition:opacity .15s,transform .12s}
.cta:hover{opacity:.92;transform:translateY(-1px)}
.cta:active{transform:none}
.cta--ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--hair)}

/* ---------- Panels ---------- */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius);padding:22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:14px}
.panel-title{font-size:15px;font-weight:540;letter-spacing:-0.015em}
.panel-meta{font-size:12px;font-weight:420;color:var(--ink3)}
.tag-soft{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:480;color:var(--attn);padding:4px 10px;border-radius:7px;border:1px solid var(--hair);white-space:nowrap}
.link-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:480;color:var(--accent);transition:opacity .15s}
.link-btn:hover{opacity:.8}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:480;white-space:nowrap}

/* ---------- Stage 1: Connect ---------- */
.loaded-banner{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:18px}
.lb-left{display:flex;align-items:center;gap:15px}
.avatar-lg{width:50px;height:50px;border-radius:50%;background:var(--panel3);color:var(--ink);font-size:17px;font-weight:520;display:grid;place-items:center;border:1px solid var(--hair);flex-shrink:0}
.lb-name{font-size:17px;font-weight:540;letter-spacing:-0.02em}
.lb-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.lb-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.lb-prog{display:flex;align-items:center;gap:11px}
.lb-prog-track{width:160px;height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
.lb-prog-track span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.lb-prog-num{font-size:12.5px;font-weight:480;color:var(--ink2)}
.status-line{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:460;color:var(--attn)}

.connect-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}

.loc-panel{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:0;overflow:hidden;margin-bottom:18px}
.loc-map{min-height:240px;background:#0d0d0f;border-right:1px solid var(--hair)}
.loc-info{padding:22px 24px 22px 2px;display:flex;flex-direction:column}
.loc-info .panel-head{margin-bottom:10px}
.loc-lede{font-size:13px;color:var(--ink2);line-height:1.55;margin-bottom:18px}
.loc-facts{display:flex;flex-direction:column;gap:1px}
.loc-fact{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair2)}
.loc-fact:last-child{border-bottom:none}
.loc-k{font-size:12.5px;color:var(--ink3)}
.loc-v{font-size:13.5px;font-weight:500;color:var(--ink);text-align:right}
.source-list{display:flex;flex-direction:column;gap:8px}
.source-row{display:flex;align-items:center;gap:13px;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--hair);background:var(--panel2);text-align:left}
.source-row--on{border-color:rgba(95,165,133,.28)}
.source-ico{width:36px;height:36px;border-radius:10px;background:var(--panel3);color:var(--ink2);display:grid;place-items:center;flex-shrink:0;border:1px solid var(--hair2)}
.source-row--on .source-ico{color:var(--good)}
.source-main{flex:1;min-width:0}
.source-label{font-size:14px;font-weight:500}
.source-desc{font-size:12.5px;color:var(--ink3);line-height:1.4;margin-top:1px}
.source-state{font-size:12px;font-weight:480;color:var(--ink2);padding:6px 12px;border-radius:8px;border:1px solid var(--hair);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.source-state--on{color:var(--good);border-color:rgba(95,165,133,.28)}
.dropzone{display:flex;align-items:center;gap:11px;margin-top:12px;padding:15px;border-radius:var(--radius-sm);border:1px dashed var(--hair);color:var(--ink3);font-size:12.5px;font-weight:420}

.toggle{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle-track{width:40px;height:23px;border-radius:12px;background:var(--panel3);position:relative;transition:background .2s;border:1px solid var(--hair)}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked + .toggle-track{background:var(--accent);border-color:transparent}
.toggle input:checked + .toggle-track .toggle-knob{transform:translateX(17px)}
.toggle-label{font-size:12.5px;font-weight:440;color:var(--ink2)}

.data-rows{display:flex;flex-direction:column}
.data-row{display:flex;align-items:center;gap:12px;padding:11px 12px;margin:0 -12px;border-radius:10px;border-bottom:1px solid var(--hair2);transition:background .15s}
.data-row:hover{background:var(--panel2)}
.data-row:last-of-type{border-bottom:none}
.data-row--missing .data-label{color:var(--ink3)}
.data-spark{display:flex;align-items:center;opacity:.7}
.data-ico{width:28px;height:28px;border-radius:8px;background:var(--panel2);color:var(--ink2);display:grid;place-items:center;flex-shrink:0;border:1px solid var(--hair2)}
.data-label{font-size:13.5px;font-weight:440;color:var(--ink2);flex:1}
.data-val{font-size:14px;font-weight:520;letter-spacing:-0.01em}
.data-unit{font-size:12px;font-weight:420;color:var(--ink3)}
.data-missing{font-size:13px;color:var(--attn);font-weight:500}
.lifestyle-rows{margin-top:16px;padding-top:16px;border-top:1px solid var(--hair2)}
.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--hair2)}
.ls-cell{display:flex;flex-direction:column;gap:3px;background:var(--panel2);border:1px solid var(--hair2);border-radius:10px;padding:11px 13px;transition:border-color .15s}
.ls-cell:hover{border-color:rgba(255,255,255,.16)}
.ls-k{font-size:11px;color:var(--ink3)}
.ls-v{font-size:13px;font-weight:480;color:var(--ink)}
.reveal{animation:revealRow .45s cubic-bezier(.22,1,.36,1)}
@keyframes revealRow{from{transform:translateY(7px)}to{transform:none}}
/* empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:38px 20px}
.empty-ico{width:56px;height:56px;border-radius:16px;background:var(--panel2);border:1px solid var(--hair2);color:var(--ink3);display:grid;place-items:center;margin-bottom:6px}
.empty-title{font-size:15px;font-weight:520}
.empty-sub{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.source-row--btn{cursor:pointer;width:100%;text-align:left}
.source-row--btn:hover{border-color:var(--accent)}
.dropzone--btn{cursor:pointer;width:100%;transition:border-color .15s}
.dropzone--btn:hover{border-color:var(--accent);color:var(--ink2)}
/* provenance chips */
.prov-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:460;color:var(--ink3)}
.prov-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.prov-dot--live{background:var(--good)}
.prov-dot--cache{background:var(--attn)}
.prov-dot--model{background:var(--accent-ink)}
.prov-strip{margin-left:auto;display:flex;gap:16px;font-size:11.5px;color:var(--ink3)}
.prov-strip span{display:inline-flex;align-items:center;gap:6px}
/* AI tag */
.ai-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:540;color:var(--accent-ink);background:var(--accent-soft);border:1px solid rgba(74,128,188,.25);padding:2px 8px;border-radius:6px;vertical-align:middle;margin-left:8px;letter-spacing:0;text-transform:none}
.ai-tag svg{flex-shrink:0}
.ai-tag--inline{margin-left:0;flex-shrink:0;align-self:flex-start}

.prov-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.prov-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair2)}
.prov-label{font-size:13px;font-weight:460;flex:1}
.prov-source{font-size:12.5px;color:var(--ink3)}
.prov-mode{font-size:10.5px;font-weight:520;padding:3px 8px;border-radius:6px;text-transform:capitalize;white-space:nowrap}
.mode-live{color:var(--good);background:rgba(95,165,133,.13)}
.mode-static{color:var(--ink2);background:var(--panel3)}
.mode-democache{color:var(--attn);background:rgba(204,139,94,.13)}
.mode-notloaded{color:var(--ink3);background:var(--panel2)}

/* ---------- Engine-run animation ---------- */
.engine{padding:6px 0}
.engine-card{background:var(--panel2);border:1px solid var(--hair);border-radius:var(--radius);padding:22px}
.engine-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.engine-orb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0;transition:all .4s}
.engine-orb--done{background:rgba(95,165,133,.16);color:var(--good)}
.engine-spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(123,178,236,.25);border-top-color:var(--accent-ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.engine-title{font-size:15.5px;font-weight:540;letter-spacing:-0.01em}
.engine-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.engine-pct{margin-left:auto;font-size:15px;font-weight:560;color:var(--ink2);font-variant-numeric:tabular-nums}
.engine-bar{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-bottom:18px}
.engine-bar span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.engine-log{display:flex;flex-direction:column;gap:11px}
.eline{display:flex;align-items:center;gap:11px;font-size:13.5px;animation:elineIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes elineIn{from{transform:translateY(6px)}to{transform:none}}
.eline-ico{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.eline--done .eline-ico{background:rgba(95,165,133,.16);color:var(--good)}
.eline--active{color:var(--ink)}
.eline--done{color:var(--ink2)}
.eline-spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(123,178,236,.25);border-top-color:var(--accent-ink);animation:spin .8s linear infinite}
.eline-text{flex:1;min-width:0}
.eline-tag{font-size:11px;font-weight:500;color:var(--ink2);background:var(--panel3);border:1px solid var(--hair2);padding:3px 9px;border-radius:6px;white-space:nowrap}
.eline-tag--warn{color:var(--attn);border-color:rgba(204,139,94,.3)}
.eline--done .eline-ico:has(svg[stroke]){}
.eline .eline-ico svg{color:inherit}

/* ---------- Section headers (shared) ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:36px 2px 16px}
.sec-eyebrow{font-size:11.5px;font-weight:540;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.sec-title{font-size:19px;font-weight:540;letter-spacing:-0.02em}
.sec-head--num{align-items:center}
.sec-left{display:flex;align-items:center;gap:14px}
.sec-n{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:560;color:var(--accent-ink);background:var(--accent-soft);border:1px solid rgba(74,128,188,.25)}
.sec-hint{font-size:12px;color:var(--ink3)}
.btn-spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:spin .8s linear infinite}
.btn-spin--dark{border-color:rgba(255,255,255,.2);border-top-color:var(--ink2)}
.cta--sm{padding:9px 15px;font-size:13px}
/* vital tile expand + detail */
.metric{position:relative}
.metric-expand{position:absolute;top:13px;right:13px;color:var(--ink3);opacity:0;transition:opacity .15s}
.metric:hover .metric-expand{opacity:1}
.metric--active{border-color:var(--accent)!important}
.metric--active .metric-expand{opacity:1;color:var(--accent-ink)}
.mdet{background:var(--panel);border:1px solid var(--accent);border-radius:var(--radius);padding:22px;margin-top:-6px;animation:revealRow .35s cubic-bezier(.22,1,.36,1)}
.mdet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.mdet-h{font-size:11px;font-weight:560;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.mdet-block p{font-size:13px;color:var(--ink2);line-height:1.55}
.mdet-foot{display:flex;align-items:center;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair2)}

/* ---------- Stage 2: Report ---------- */
.bento{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
.bento--2{grid-template-columns:1fr 1fr;align-items:start}

.b-risk{display:flex;flex-direction:column}
.src-tag{font-size:11.5px;font-weight:460;color:var(--ink3);background:var(--panel2);border:1px solid var(--hair2);padding:5px 11px;border-radius:7px;white-space:nowrap}
.risk-head-row{display:flex;gap:20px;align-items:flex-start;margin-bottom:16px}
.est{position:relative;width:92px;height:92px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.est-ring{position:absolute;inset:0}
.est--locked .est-ring{filter:blur(2.5px);opacity:.7}
.est-glyph{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--hair);color:var(--ink2)}
.est--ready .est-glyph{color:var(--good);border-color:rgba(95,165,133,.4);background:rgba(95,165,133,.12)}
.est-cap{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:560;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);background:var(--panel);padding:1px 7px;border-radius:5px}
.est--ready .est-cap{color:var(--good)}
.risk-head-text{flex:1;min-width:0}
.risk-headline{font-size:18px;font-weight:520;letter-spacing:-0.02em;line-height:1.25;margin-bottom:8px}
.risk-body{font-size:13px;color:var(--ink2);line-height:1.55}
.risk-factors{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tag-soft--ok{color:var(--good)}
.factor{font-size:12px;font-weight:440;color:var(--ink2);background:var(--panel2);padding:5px 10px;border-radius:7px;border:1px solid var(--hair2)}
.factor--up{color:var(--attn);border-color:rgba(204,139,94,.22)}
.unlock-box{margin-top:16px;background:var(--accent-soft);border:1px solid rgba(74,128,188,.2);border-radius:13px;padding:15px 16px}
.unlock-box--ok{background:rgba(95,165,133,.1);border-color:rgba(95,165,133,.28)}
.unlock-head{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink);line-height:1.45;margin-bottom:11px}
.unlock-head svg{color:var(--accent-ink);flex-shrink:0;margin-top:1px}
.unlock-box--ok .unlock-head svg{color:var(--good)}
.unlock-head b{font-weight:600}
.unlock-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.unlock-list li{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink2);line-height:1.45}
.unlock-list li svg{color:var(--accent-ink);flex-shrink:0;margin-top:3px}
.unlock-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.unlock-note{font-size:11.5px;color:var(--ink3)}
.unlock-missing{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unlock-missing-label{font-size:11.5px;font-weight:520;color:var(--ink2);letter-spacing:.02em;text-transform:uppercase}
.missing-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:480;color:var(--ink);background:var(--panel3);border:1px solid var(--hair);border-radius:9px;padding:4px 10px}

.b-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-size:30px;font-weight:540;letter-spacing:-0.03em;line-height:1}
.ring-cap{font-size:12px;color:var(--ink3);margin-top:3px}
.ring-foot-title{font-size:14px;font-weight:520}
.ring-foot-sub{font-size:12.5px;color:var(--ink3);margin-top:3px}

/* eligibility card */
.elig-card{padding:24px}
.elig-head-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.elig-ico{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.elig-headtext{flex:1;min-width:0}
.elig-head{font-size:17px;font-weight:530;letter-spacing:-0.02em;line-height:1.25;margin-bottom:6px}
.elig-reason{font-size:13px;color:var(--ink2);line-height:1.55}
.elig-likely{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--good);background:rgba(95,165,133,.12);border:1px solid rgba(95,165,133,.28);padding:6px 12px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.elig-criteria{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;padding:20px 0;border-top:1px solid var(--hair2);border-bottom:1px solid var(--hair2)}
.elig-crit{display:flex;align-items:flex-start;gap:11px}
.elig-crit-ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.elig-crit-ico.ok{background:rgba(95,165,133,.16);color:var(--good)}
.elig-crit-ico.unk{background:var(--panel3);color:var(--ink3)}
.elig-crit-ico.no{background:rgba(207,128,119,.16);color:var(--high)}
.elig-crit-label{font-size:13.5px;font-weight:500}
.elig-crit-detail{font-size:12px;color:var(--ink3);line-height:1.45;margin-top:2px}
.elig-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px}
.elig-note{font-size:12.5px;color:var(--ink3);line-height:1.5;flex:1}
.elig-actions{display:flex;align-items:center;gap:14px;flex-shrink:0}

.metric-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.metric{text-align:left;background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius-sm);padding:15px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,transform .14s}
.metric:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.16)}
.metric--missing{border-style:dashed;border-color:rgba(204,139,94,.32)}
.metric-top{display:flex;align-items:center;justify-content:space-between}
.metric-ico{width:30px;height:30px;border-radius:8px;background:var(--panel2);color:var(--ink2);display:grid;place-items:center;border:1px solid var(--hair2)}
.metric .chip{font-size:10.5px}
.metric-label{font-size:12px;font-weight:440;color:var(--ink3)}
.metric-value{display:flex;align-items:baseline;gap:3px;min-height:26px}
.metric-num{font-size:22px;font-weight:540;letter-spacing:-0.03em}
.metric-unit{font-size:11px;font-weight:420;color:var(--ink3)}
.metric-add{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:520;color:var(--attn)}
.metric-added{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:560;color:var(--good);background:rgba(95,165,133,.14);padding:3px 7px;border-radius:6px}
.metric-spark{margin-left:auto;display:flex;align-items:flex-end}
.metric-note{font-size:11px;color:var(--ink3);line-height:1.4}

/* recommended actions as aligned cards */
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

/* ---------- Charts / health stats ---------- */
.chart-panel{display:flex;flex-direction:column}
.chart-svg{width:100%;height:auto;display:block;margin-top:4px}
.chart-tick{fill:var(--ink3);font-size:11px;font-family:var(--sans);font-weight:440}
.range-list{display:flex;flex-direction:column;gap:22px}
.range-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.range-label{font-size:13px;font-weight:500;color:var(--ink2);flex-shrink:0}
.range-val{font-size:14px;font-weight:540;letter-spacing:-0.01em;white-space:nowrap;text-align:right;display:inline-flex;align-items:center;gap:7px}
.range-unit{font-size:11px;font-weight:420;color:var(--ink3)}
.range-zone{font-size:10.5px;font-weight:560;padding:2px 8px;border-radius:6px}
.range-meter{position:relative;display:flex;gap:3px;height:9px}
.range-seg{height:100%;border-radius:3px;flex-basis:0;transition:opacity .3s}
.range-pin{position:absolute;top:-4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.range-pin-dot{width:13px;height:13px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.range-scale{display:flex;margin-top:7px}
.range-cap{font-size:10.5px;color:var(--ink3);margin-top:7px}
.fmix{margin-bottom:14px}
.fmix-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:16px;gap:2px}
.fmix-seg{height:100%;opacity:.82;border-radius:2px}
.fmix-legend{display:flex;flex-direction:column;gap:10px}
.fmix-row{display:flex;align-items:center;gap:10px;font-size:13px}
.fmix-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.fmix-name{color:var(--ink2);flex:1}
.fmix-num{color:var(--ink);font-weight:540}
.fmix-note{font-size:12px;color:var(--ink3);line-height:1.55}
.action-card{display:flex;flex-direction:column}
.action-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.action-num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:540;flex-shrink:0;background:var(--panel2);color:var(--ink2);border:1px solid var(--hair2)}
.action-num.tone-high{color:var(--high);border-color:rgba(207,128,119,.3)}
.action-num.tone-attention{color:var(--attn);border-color:rgba(204,139,94,.3)}
.action-tag{font-size:10px;font-weight:540;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--hair);padding:3px 8px;border-radius:6px}
.action-title{font-size:15.5px;font-weight:520;letter-spacing:-0.015em;margin-bottom:7px}
.action-body{font-size:13px;color:var(--ink2);line-height:1.55;margin-bottom:14px}
.action-where{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:460;color:var(--accent-ink);margin-top:auto}

.qa-list{list-style:none;display:flex;flex-direction:column;gap:18px}
.qa-item{display:flex;gap:13px}
.qa-q{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.qa-body{flex:1;min-width:0}
.qa-text{font-size:14.5px;font-weight:480;color:var(--ink);line-height:1.4;margin-bottom:4px}
.qa-why{font-size:12.5px;color:var(--ink3);line-height:1.5;margin-bottom:7px}
.qa-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:480;color:var(--accent-ink);transition:opacity .15s}
.qa-link:hover{opacity:.8}
.gp-summary-panel{margin-bottom:18px}
.gp-summary-panel .panel-head,.gp-q-panel .panel-head{align-items:flex-start}
.gp-q-panel{margin-bottom:8px}
.b-gp{display:flex;flex-direction:column}
.gp-summary{position:relative;background:var(--panel2);border:1px solid var(--hair2);border-radius:var(--radius-sm);padding:16px;overflow:hidden}
.gp-summary-text{font-size:13px;line-height:1.6;color:var(--ink2);transition:opacity .3s}
.gp-summary--regen .gp-summary-text{opacity:.35}
.gp-regen-bar{position:absolute;left:0;bottom:0;height:2px;width:40%;background:var(--accent);border-radius:2px;animation:regenSlide 1.1s ease-in-out infinite}
@keyframes regenSlide{0%{left:-40%}100%{left:100%}}
.gp-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px}
.gp-foot-note{font-size:11.5px;color:var(--ink3)}
.link-btn[disabled]{opacity:.6;cursor:default}
.copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ink);background:var(--panel3);border:1px solid var(--hair);padding:6px 12px;border-radius:8px;transition:all .2s}
.copy-btn--done{color:var(--good);border-color:rgba(95,165,133,.4)}
.gp-hint{font-size:11.5px;color:var(--ink3);margin-top:12px}

.safety-foot{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:8px;max-width:780px}

/* ---------- Stage 3: Local Care ---------- */
.stage--airy .sec-head{margin-top:44px}
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.fpill{font-size:13px;font-weight:450;color:var(--ink2);background:var(--panel);padding:8px 15px;border-radius:20px;border:1px solid var(--hair);transition:all .15s}
.fpill:hover{color:var(--ink)}
.fpill--on{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:500}
.filter-hint{margin-left:auto;font-size:12px;color:var(--ink3)}
.map-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-bottom:18px}
.map-box{height:460px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--hair);z-index:1;background:#0d0d0f}
.home-pin{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent);position:relative}
.home-pin span{position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(74,128,188,.5);animation:ripple 2.2s infinite}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.svc-pin{width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.3)}

/* service list */
.svc-list{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding-right:2px}
.svc-row{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius-sm);padding:14px 15px;text-align:left;transition:border-color .15s}
.svc-row:hover{border-color:rgba(255,255,255,.18)}
.svc-row--on{border-color:var(--accent)}
.svc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.svc-name{font-size:14px;font-weight:500;letter-spacing:-0.01em}
.svc-meta{font-size:12px;color:var(--ink3)}
.svc-travel{display:flex;align-items:center;gap:13px;font-size:12px;color:var(--ink2)}
.svc-travel span{display:inline-flex;align-items:center;gap:4px}
.svc-travel svg{color:var(--ink3)}
.svc-dist{color:var(--ink3)}
.svc-badge{align-self:flex-start;font-size:10.5px;font-weight:520;color:var(--good);background:rgba(95,165,133,.13);padding:3px 9px;border-radius:6px}
.svc-chips{display:flex;flex-wrap:wrap;gap:5px}
.svc-elig{font-size:10.5px;font-weight:480;padding:3px 9px;border-radius:6px;border:1px solid var(--hair2)}
.svc-elig--ok{color:var(--accent-ink);background:var(--accent-soft);border-color:rgba(74,128,188,.22)}
.svc-elig--info{color:var(--accent-ink);background:rgba(74,128,188,.08);border-color:rgba(74,128,188,.18)}
.svc-elig--warn{color:var(--attn);background:var(--attn-soft);border-color:rgba(204,139,94,.22)}
.svc-elig--muted{color:var(--ink3);background:var(--panel2)}

/* ---- Local-care: three-tier mental model strip ---- */
.lc-mental-model{
  display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:14px;align-items:stretch;
  margin:18px 18px 14px;
}
.lc-mm-card{
  background:var(--panel);border:1px solid var(--hair);border-radius:14px;
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.lc-mm-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:520;color:var(--ink2);letter-spacing:-.005em}
.lc-mm-pin{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--panel3);color:var(--accent-ink)}
.lc-mm-rule{font-size:18px;font-weight:560;color:var(--ink);letter-spacing:-.014em;line-height:1.15}
.lc-mm-sub{font-size:12px;font-weight:430;color:var(--ink3);line-height:1.5}
.lc-mm-arrow{display:grid;place-items:center;color:var(--ink3)}
@media (max-width: 880px){
  .lc-mental-model{grid-template-columns:1fr;gap:8px}
  .lc-mm-arrow{display:none}
}

/* ---- Local-care: informed-choice card (out-of-area registration etc) ---- */
.lc-info-card{
  margin:22px 18px 6px;padding:18px 20px;border-radius:14px;
  background:linear-gradient(180deg, var(--accent-soft), var(--panel));
  border:1px solid rgba(74,128,188,.2);
}
.lc-info-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.lc-info-ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid rgba(74,128,188,.25)}
.lc-info-title{font-size:14.5px;font-weight:540;color:var(--ink);letter-spacing:-.011em;margin:0}
.lc-info-body{font-size:13px;color:var(--ink2);line-height:1.55;margin:0 0 10px}
.lc-info-list{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lc-info-list li{font-size:12.5px;color:var(--ink2);line-height:1.55;display:flex;gap:8px}
.lc-info-list li b{color:var(--ink);font-weight:520}
.lc-info-bullet{color:var(--accent-ink);font-weight:560;margin-top:-2px}
.lc-info-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:480;color:var(--accent-ink)}
.lc-info-link:hover{text-decoration:underline}
.svc-chev{color:var(--ink3);flex-shrink:0}

/* full-width service detail */
.md-panel{padding:24px;margin-bottom:18px}
.md-top{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.md-ico{width:42px;height:42px;border-radius:11px}
.md-info{flex:1;min-width:0}
.md-name{font-size:18px;font-weight:540;letter-spacing:-0.02em}
.md-open{font-size:12.5px;font-weight:480;color:var(--good);white-space:nowrap}
.md-why{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.md-why svg{color:var(--accent-ink);flex-shrink:0;margin-top:1px}
.md-travel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.md-travel-item{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--hair2);border-radius:12px;padding:13px 15px}
.md-travel-item svg{color:var(--ink3);flex-shrink:0}
.md-travel-v{font-size:15px;font-weight:540;letter-spacing:-0.01em}
.md-travel-k{font-size:11.5px;color:var(--ink3);margin-top:1px}
.md-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 28px;margin-bottom:22px}
.md-block-h{font-size:11px;font-weight:560;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px}
.md-offers{display:flex;flex-wrap:wrap;gap:7px}
.md-offer{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:440;color:var(--ink2);background:var(--panel2);border:1px solid var(--hair2);padding:6px 11px;border-radius:7px}
.md-offer svg{color:var(--good)}
.md-offer--key{color:var(--good);border-color:rgba(95,165,133,.35);background:rgba(95,165,133,.1)}
.md-elig{font-size:13px;color:var(--ink2);line-height:1.6}
.md-actions{display:flex;gap:10px;flex-wrap:wrap}
.md-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:480;color:#fff;background:var(--accent);padding:11px 18px;border-radius:10px;transition:opacity .15s}
.md-btn:hover{opacity:.9}
.md-btn--ghost{background:var(--panel3);color:var(--ink);border:1px solid var(--hair)}

/* waiting times — minimalist bars */
.info-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:460;color:var(--accent-ink);padding:7px 12px;border-radius:9px;border:1px solid var(--hair);background:var(--panel);transition:all .15s}
.info-btn:hover{border-color:var(--accent)}
.wait-card{padding:22px 24px}
.wait-legend{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--hair2)}
.wl-item{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.wl-swatch{width:13px;height:8px;border-radius:3px}
.wl-first{background:var(--accent-ink)}
.wl-treat{background:rgba(74,128,188,.4)}
.wl-marker{width:2px;height:13px;background:var(--ink2);border-radius:1px}
.wait-list{display:flex;flex-direction:column;gap:6px}
.wait-row{display:grid;grid-template-columns:200px 1fr auto;align-items:center;gap:22px;padding:16px 12px;margin:0 -12px;border-radius:12px;text-align:left;transition:background .15s}
.wait-row:hover{background:var(--panel2)}
.wait-prov{min-width:0}
.wait-name{font-size:14px;font-weight:500}
.wait-spec{font-size:12px;color:var(--ink3);margin-top:2px}
.wait-track{position:relative;height:10px;background:var(--panel3);border-radius:5px;overflow:visible}
.wait-fill{position:absolute;top:0;left:0;height:100%;border-radius:5px}
.wait-fill-treat{background:rgba(74,128,188,.4)}
.wait-fill-first{background:var(--accent-ink)}
.wait-std{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink2);border-radius:1px}
.wait-nums{display:flex;align-items:center;gap:9px;white-space:nowrap}
.wait-num{font-size:12px;color:var(--ink3)}
.wait-num b{font-size:16px;font-weight:560;color:var(--ink);letter-spacing:-0.02em}
.wait-arrow{color:var(--ink3);font-size:13px}
.wait-trend{display:inline-flex;width:22px;justify-content:center}
.wait-trend--down{color:var(--good)}
.wait-trend--up{color:var(--attn)}
.wait-flat{color:var(--ink3)}
.wait-disc{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair2)}

/* trusted reading cards */
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.content-card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius-sm);padding:18px 20px;transition:border-color .15s}
.content-card:hover{border-color:rgba(255,255,255,.18)}
.cc-rel{font-size:10.5px;font-weight:540;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
.cc-title{font-size:15px;font-weight:520;margin-bottom:5px;letter-spacing:-0.01em}
.cc-sum{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:14px}
.cc-foot{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:460;color:var(--ink3);margin-top:auto}

/* info popover */
.popover-scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:24px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.popover{position:relative;width:min(440px,100%);background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop .22s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.popover-x{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);transition:all .15s}
.popover-x:hover{background:var(--panel3);color:var(--ink)}
.popover-title{font-size:17px;font-weight:560;letter-spacing:-0.02em;margin-bottom:10px;padding-right:30px}
.popover-body{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:16px}
.popover-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:480;color:#fff;background:var(--accent);padding:10px 16px;border-radius:10px;transition:opacity .15s}
.popover-link:hover{opacity:.9}

/* leaflet dark */
.leaflet-container{font-family:var(--sans);background:#0d0d0f}
.leaflet-tooltip{font-size:12px;font-weight:480;border-radius:7px;border:1px solid var(--hair);background:var(--panel2);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.leaflet-tooltip-top:before{border-top-color:var(--panel2)}
.leaflet-bar a{background:var(--panel2);color:var(--ink);border-color:var(--hair)}
.leaflet-bar a:hover{background:var(--panel3)}
.leaflet-popup-content-wrapper{background:var(--panel2);color:var(--ink);border:1px solid var(--hair);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:var(--panel2);border:1px solid var(--hair)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--sans)}
.mappop-name{font-size:13.5px;font-weight:560;margin-bottom:3px}
.mappop-meta{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.mappop-travel{display:flex;gap:12px;font-size:12px;color:var(--ink2);border-top:1px solid var(--hair2);padding-top:7px}

/* leaflet dark */
.leaflet-container{font-family:var(--sans);background:#0d0d0f}
.leaflet-tooltip{font-size:12px;font-weight:480;border-radius:7px;border:1px solid var(--hair);background:var(--panel2);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.leaflet-tooltip-top:before{border-top-color:var(--panel2)}
.leaflet-bar a{background:var(--panel2);color:var(--ink);border-color:var(--hair)}
.leaflet-bar a:hover{background:var(--panel3)}

.user-chip{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 6px;border-radius:20px;border:1px solid transparent;transition:border-color .15s,background .15s}
.user-chip:hover{background:var(--hair2)}
.user-chip--on{border-color:var(--hair);background:var(--panel2)}

/* ---------- Login ---------- */
.login{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:40px 24px}
.login-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--hair);border-radius:22px;padding:40px 36px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.login-mark{width:60px;height:60px;border-radius:17px;background:linear-gradient(155deg,#4A80BC,#345E8C);color:#fff;display:grid;place-items:center;margin:0 auto 20px}
.login-title{font-size:22px;font-weight:560;letter-spacing:-0.025em;margin-bottom:10px}
.login-sub{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:26px}
.login-btn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:14.5px;font-weight:500;color:#fff;background:var(--accent);padding:14px;border-radius:12px;transition:opacity .15s}
.login-btn:hover{opacity:.92}
.login-alt{display:block;width:100%;margin-top:12px;font-size:13px;font-weight:460;color:var(--ink2);padding:11px;border-radius:10px;transition:color .15s}
.login-alt:hover{color:var(--ink)}
.login-foot{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-top:22px}
.login-engine{text-align:left}

/* ---------- Page scaffold ---------- */
.stage--page{max-width:1080px}
.page-head{margin-bottom:8px}
.page-head .stage-title{margin-top:4px}

/* Resources */
.res-group{margin-top:32px}
.res-group-title{font-size:15px;font-weight:540;letter-spacing:-0.01em;margin-bottom:14px;color:var(--ink2)}

/* Support */
.urgent-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0 8px}
.urgent-card{display:flex;flex-direction:column;gap:5px;padding:18px 20px;border-radius:var(--radius-sm);border:1px solid var(--hair);background:var(--panel);transition:border-color .15s}
.urgent-card:hover{border-color:rgba(255,255,255,.2)}
.urgent-card--high{border-left:3px solid var(--high)}
.urgent-card--attn{border-left:3px solid var(--attn)}
.urgent-label{font-size:15px;font-weight:560}
.urgent-desc{font-size:12.5px;color:var(--ink2);line-height:1.5}
.urgent-go{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--accent-ink);margin-top:6px}
.faq-list{display:flex;flex-direction:column}
.faq{border-bottom:1px solid var(--hair2)}
.faq:last-child{border-bottom:none}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;font-size:14px;font-weight:480;color:var(--ink);text-align:left}
.faq-q span{flex:1}
.faq-q svg{color:var(--ink3);flex-shrink:0}
.faq-a{font-size:13px;color:var(--ink2);line-height:1.6;padding:0 0 16px;animation:revealRow .3s ease}
.contact-list{display:flex;flex-direction:column;gap:8px}
.contact-row{display:flex;align-items:center;gap:13px;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--hair2);background:var(--panel2);text-align:left;transition:border-color .15s}
.contact-row:hover{border-color:var(--accent)}
.contact-main{flex:1;min-width:0}
.contact-label{font-size:14px;font-weight:500}
.contact-desc{font-size:12px;color:var(--ink3);margin-top:1px}

/* Profile */
.profile-hero{display:flex;align-items:center;gap:20px}
.avatar-xl{width:64px;height:64px;border-radius:50%;background:linear-gradient(150deg,#4A80BC,#345E8C);color:#fff;font-size:22px;font-weight:540;display:grid;place-items:center;flex-shrink:0}
.profile-id{flex:1;min-width:0}
.profile-name{font-size:20px;font-weight:560;letter-spacing:-0.02em}
.profile-meta{font-size:13px;color:var(--ink2);margin:3px 0 9px}
.profile-tags{display:flex;flex-wrap:wrap;gap:8px}
.profile-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:480;color:var(--ink2);background:var(--panel2);border:1px solid var(--hair2);padding:4px 10px;border-radius:7px}
.signout-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:480;color:var(--ink2);background:var(--panel2);border:1px solid var(--hair);padding:9px 15px;border-radius:10px;transition:all .15s;flex-shrink:0}
.signout-btn:hover{color:var(--ink);border-color:var(--accent)}
.pstat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pstat{background:var(--panel2);border:1px solid var(--hair2);border-radius:12px;padding:15px 16px}
.pstat-n{font-size:22px;font-weight:560;letter-spacing:-0.02em}
.pstat-k{font-size:11.5px;color:var(--ink3);margin-top:3px}
.set-list{display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;text-align:left;transition:background .15s}
.set-row:hover{background:var(--panel2)}
.set-label{font-size:13.5px;font-weight:460;flex-shrink:0}
.set-val{flex:1;text-align:right;font-size:12.5px;color:var(--ink3)}

/* responsive */
@media (max-width:1080px){
  .bento{grid-template-columns:1fr}
  .bento--2{grid-template-columns:1fr}
  .action-grid{grid-template-columns:1fr 1fr}
  .metric-grid{grid-template-columns:repeat(3,1fr)}
  .elig-criteria{grid-template-columns:1fr}
  .elig-foot{flex-direction:column;align-items:flex-start;gap:14px}
  .map-layout{grid-template-columns:1fr}
  .loc-panel{grid-template-columns:1fr}
  .loc-map{border-right:none;border-bottom:1px solid var(--hair)}
  .loc-info{padding:0 22px 22px}
  .md-grid{grid-template-columns:1fr}
  .md-travel{grid-template-columns:1fr 1fr}
  .content-grid{grid-template-columns:1fr}
  .connect-grid,.prov-grid{grid-template-columns:1fr}
  .mdet-grid{grid-template-columns:1fr}
  .urgent-row,.pstat-grid{grid-template-columns:1fr}
  .profile-hero{flex-wrap:wrap}
  .svc-list{max-height:none}
}
@media (max-width:720px){
  .appbar{gap:14px;padding:0 14px}
  .appnav{display:none}
  .stagebar{gap:12px;padding:0 14px}
  .stagebar-label,.stagebar-progress{display:none}
  .step-label{display:none}
  .step-line{width:12px}
  .brand-name,.user-name{display:none}
  .stage{padding:24px 18px 50px}
  .stage-head{flex-direction:column;align-items:flex-start;gap:18px}
  .bento,.bento--2,.action-grid{grid-template-columns:1fr}
  .elig-head-row{flex-wrap:wrap}
  .metric-grid{grid-template-columns:repeat(2,1fr)}
  .wait-row{grid-template-columns:1fr;gap:12px}
  .wait-track{order:3}
  .loaded-banner{flex-direction:column;align-items:flex-start;gap:16px}
  .lb-right{align-items:flex-start}
}

/* ---------- Loading UX (added for backend wiring) ---------- */
/* Thin progress bar at the very top of the viewport. */
.pp-loading-bar{
  position:fixed;top:0;left:0;right:0;height:2px;z-index:60;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size:200% 100%;
  animation:pp-bar 1.1s linear infinite;
  pointer-events:none;
}
@keyframes pp-bar{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Stage wrap: when loading, blur + dim the params underneath the overlay. */
.pp-stage-wrap{transition:filter .25s ease, opacity .25s ease}
.pp-stage-wrap.data-loading{
  filter:blur(8px);
  opacity:.32;
  pointer-events:none;
  user-select:none;
}

/* Centered loading overlay. pointer-events:none so nav above still works. */
.pp-loading-overlay{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:55;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:26px 34px;border-radius:var(--radius);
  background:rgba(22,22,24,.94);
  border:1px solid var(--hair);
  box-shadow:0 16px 60px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.04) inset;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  animation:pp-overlay-in .22s ease both;
  min-width:280px;
}
@keyframes pp-overlay-in{
  from{opacity:0;transform:translate(-50%,-46%) scale(.96)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

/* Dual-ring spinner. */
.pp-spinner{position:relative;width:42px;height:42px}
.pp-spinner::before,.pp-spinner::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2.5px solid transparent;
}
.pp-spinner::before{
  border-top-color:var(--accent-ink);
  border-right-color:var(--accent-ink);
  animation:pp-spin 1s cubic-bezier(.55,.05,.45,.95) infinite;
}
.pp-spinner::after{
  border-bottom-color:rgba(122,166,212,.22);
  border-left-color:rgba(122,166,212,.22);
  animation:pp-spin 1.6s cubic-bezier(.55,.05,.45,.95) infinite reverse;
}
@keyframes pp-spin{to{transform:rotate(360deg)}}

.pp-loading-text{
  font-size:14px;font-weight:520;color:var(--ink);letter-spacing:-.008em;
  text-align:center;
}
.pp-loading-sub{
  font-size:11.5px;font-weight:440;color:var(--ink3);letter-spacing:.005em;
  text-align:center;line-height:1.45;max-width:240px;
}

/* Pulsing dots (accent under loading-sub). */
.pp-loading-dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.pp-loading-dots span{
  width:3px;height:3px;border-radius:50%;background:var(--accent-ink);
  animation:pp-dot 1.2s ease-in-out infinite;opacity:.55;
}
.pp-loading-dots span:nth-child(2){animation-delay:.18s}
.pp-loading-dots span:nth-child(3){animation-delay:.36s}
@keyframes pp-dot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}

/* Shimmer skeleton (reusable for any element). */
@keyframes pp-shimmer{from{background-position:-150% 0}to{background-position:150% 0}}
.pp-shimmer{
  background:linear-gradient(90deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.02) 100%);
  background-size:200% 100%;
  animation:pp-shimmer 1.4s linear infinite;
  border-radius:6px;color:transparent !important;
}

/* Source badge. */
.src-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:540;letter-spacing:.01em;
  padding:3px 9px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--hair);color:var(--ink2);
  transition:all .15s;
}
.src-badge--ok{color:var(--good);border-color:rgba(95,165,133,.3);background:rgba(95,165,133,.08)}
.src-badge--info{color:var(--accent-ink);border-color:rgba(74,128,188,.3);background:var(--accent-soft)}
.src-badge--warn{color:var(--attn);border-color:rgba(204,139,94,.3);background:var(--attn-soft)}
.src-badge--error{color:var(--high);border-color:rgba(207,128,119,.3);background:rgba(207,128,119,.08)}
.src-badge--muted{color:var(--ink3)}
.src-badge--loading{color:var(--accent-ink);border-color:rgba(74,128,188,.3);background:var(--accent-soft)}
.src-badge-dot{
  width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:pp-dot 1.2s ease-in-out infinite;
}

/* Randomize button (segment-control adjacent). */
.mode-randomize{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent-ink);
  margin-left:1px;transition:all .15s;
}
.mode-randomize:hover{background:var(--accent);color:#fff}
.mode-randomize:disabled{opacity:.5;cursor:not-allowed}
.mode-randomize.spin{animation:pp-spin .9s linear infinite}

/* ---------- Login form fields ---------- */
.login-field-label{display:block;font-size:11.5px;font-weight:540;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin:14px 0 7px}
.login-input{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--hair);border-radius:11px;padding:12px 14px;transition:border-color .15s,background .15s}
.login-input:focus{outline:none;border-color:var(--accent);background:var(--panel3)}
.login-error{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--attn);background:var(--attn-soft);border:1px solid rgba(204,139,94,.25);border-radius:9px;padding:9px 12px;margin-top:13px}
.login-demo-creds{margin-top:20px;padding:14px 16px;background:var(--panel2);border:1px dashed var(--hair);border-radius:12px}
.login-demo-creds-h{font-size:10.5px;font-weight:560;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.login-demo-creds-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink2);padding:3px 0}
.login-demo-creds-row code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink);background:var(--panel3);padding:3px 8px;border-radius:6px;border:1px solid var(--hair2)}
.login-demo-fill{margin-top:10px;font-size:12px;font-weight:500;color:var(--accent-ink);background:transparent;border:none;cursor:pointer;padding:4px 0}
.login-demo-fill:hover{text-decoration:underline}

/* ---------- Connect: profile hero ---------- */
.profile-strip{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.profile-strip .avatar-xl{width:58px;height:58px;font-size:20px}
.profile-strip-id{flex:1;min-width:0}
.profile-strip-name{font-size:18px;font-weight:540;letter-spacing:-0.02em}
.profile-strip-meta{font-size:13px;color:var(--ink2);margin-top:3px}
.profile-strip-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.profile-strip .profile-tag{font-size:11px}
.profile-edit{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:480;color:var(--ink2);background:var(--panel2);border:1px solid var(--hair);padding:8px 13px;border-radius:9px;cursor:pointer;transition:border-color .15s}
.profile-edit:hover{border-color:var(--accent);color:var(--ink)}

/* ---------- Postcode selector ---------- */
.pc-form{display:flex;gap:8px;margin-top:14px}
.pc-input{flex:1;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--hair);border-radius:9px;padding:9px 12px;text-transform:uppercase;letter-spacing:.04em}
.pc-input:focus{outline:none;border-color:var(--accent)}
.pc-btn{font-size:12.5px;font-weight:500;color:#fff;background:var(--accent);border:none;border-radius:9px;padding:0 14px;cursor:pointer;transition:opacity .15s}
.pc-btn:hover{opacity:.92}
.pc-btn[disabled]{opacity:.5;cursor:default}
.pc-msg{font-size:12px;color:var(--ink3);margin-top:8px}
.pc-msg--err{color:var(--high)}
.pc-msg--ok{color:var(--good)}

/* ---------- Manual entry inline form ---------- */
.manual-form{margin-top:14px;padding:16px;background:var(--panel2);border:1px solid var(--hair);border-radius:13px;animation:revealRow .3s cubic-bezier(.22,1,.36,1)}
.manual-form-h{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:520;margin-bottom:12px}
.manual-form-close{font-size:18px;color:var(--ink3);background:none;border:none;cursor:pointer;line-height:1}
.manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.manual-field{display:flex;flex-direction:column;gap:5px}
.manual-field-label{font-size:11px;font-weight:520;letter-spacing:.03em;color:var(--ink3);text-transform:uppercase}
.manual-field input,.manual-field select{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--panel3);border:1px solid var(--hair2);border-radius:8px;padding:8px 10px}
.manual-field input:focus,.manual-field select:focus{outline:none;border-color:var(--accent)}
.manual-field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.manual-foot-note{margin-top:10px;font-size:11.5px;color:var(--ink3);line-height:1.45}
.manual-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.manual-cancel{font-size:12.5px;color:var(--ink2);background:transparent;border:1px solid var(--hair);border-radius:9px;padding:8px 14px;cursor:pointer}
.manual-save{font-size:12.5px;font-weight:500;color:#fff;background:var(--accent);border:none;border-radius:9px;padding:8px 16px;cursor:pointer}

/* ---------- Uploaded records list ---------- */
.records-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.record-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--hair2);border-radius:9px;padding:8px 12px}
.record-row .record-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
