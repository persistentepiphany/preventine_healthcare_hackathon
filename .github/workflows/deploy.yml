name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vercel:
    name: Deploy UI to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_ze4FMhCK70oVoU62iczTWqe5
      VERCEL_PROJECT_ID: prj_NFJBPNSv06bMYKrMpnyb3YOViJ6g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project config
        working-directory: ui/Preventive Care
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        working-directory: ui/Preventive Care
        run: vercel deploy --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  railway:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy to Railway
        run: railway up --ci --service preventive-api
        env:
          # Use a Railway project token scoped to preventive-healthcare-api.
          # See https://docs.railway.com/guides/cli#using-an-account-or-project-token
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
